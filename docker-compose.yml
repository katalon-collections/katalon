services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-katalon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-katalon}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-katalon}" ]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 10

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - bootstrap.memory_lock=${ES_MEMORY_LOCK:-false}
      - ES_JAVA_OPTS=-Xms${ES_HEAP_SIZE:-512m} -Xmx${ES_HEAP_SIZE:-512m}
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: [ "CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health | grep -v red" ]
      interval: 15s
      timeout: 10s
      retries: 20

  # Legt das Cache-Verzeichnis an und übergibt es dem Cantaloupe-User (UID aus
  # dem Image, nicht fest verdrahtet). Ändert nur Einträge mit falschem Eigentümer.
  cantaloupe-cache-init:
    image: islandora/cantaloupe:7.0.22
    user: "0:0"
    entrypoint: [ "sh", "-c", "mkdir -p /data/cache && find /data ! -user cantaloupe -exec chown cantaloupe:cantaloupe {} +" ]
    volumes:
      - ${CANTALOUPE_CACHE_DIR:-cantaloupe_cache}:/data
    restart: "no"

  cantaloupe:
    image: islandora/cantaloupe:7.0.22
    volumes:
      - ${MEDIA_ROOT:-/srv/katalon/media}:/var/lib/cantaloupe/images:ro
      # Derivat-Cache auf Platte (benanntes Volume oder CANTALOUPE_CACHE_DIR=/pfad),
      # übersteht Neustarts. Ohne Plattenplatz: CANTALOUPE_FILESYSTEMCACHE_PATHNAME=/tmpfs/cache
      # nutzt stattdessen den tmpfs (Größe CANTALOUPE_CACHE_TMPFS_SIZE, leer nach Neustart).
      - ${CANTALOUPE_CACHE_DIR:-cantaloupe_cache}:/data
      - type: tmpfs
        target: /tmpfs
        tmpfs:
          size: ${CANTALOUPE_CACHE_TMPFS_SIZE:-512m}
          mode: 1023  # = 0o1777 (Compose liest den Wert dezimal)
    depends_on:
      cantaloupe-cache-init:
        condition: service_completed_successfully
    environment:
      # Gemessen (2026-10, 16 parallele Bildanfragen inkl. full/max): ~0,6 GB Heap
      # belegt. Das Image-Default (3G/5G) reserviert unnötig RAM, 256m Maximum
      # reicht unter Last nicht.
      - CANTALOUPE_HEAP_MIN=${CANTALOUPE_HEAP_MIN:-256m}
      - CANTALOUPE_HEAP_MAX=${CANTALOUPE_HEAP_MAX:-1g}
      - CANTALOUPE_SOURCE_STATIC=FilesystemSource
      - CANTALOUPE_FILESYSTEMSOURCE_LOOKUP_STRATEGY=BasicLookupStrategy
      - CANTALOUPE_FILESYSTEMSOURCE_BASICLOOKUPSTRATEGY_PATH_PREFIX=/var/lib/cantaloupe/images/
      - CANTALOUPE_BASE_URI=${CANTALOUPE_PUBLIC_URL:-http://localhost}
      - CANTALOUPE_CACHE_SERVER_DERIVATIVE=FilesystemCache
      - CANTALOUPE_CACHE_SERVER_DERIVATIVE_ENABLED=true
      - CANTALOUPE_FILESYSTEMCACHE_PATHNAME=${CANTALOUPE_FILESYSTEMCACHE_PATHNAME:-/data/cache}
      # Der Cache-Worker löscht abgelaufene Derivate; ohne ihn wächst der Cache unbegrenzt.
      - CANTALOUPE_CACHE_SERVER_WORKER_ENABLED=true
      - CANTALOUPE_CACHE_SERVER_DERIVATIVE_TTL_SECONDS=${CANTALOUPE_CACHE_SERVER_DERIVATIVE_TTL_SECONDS:-2592000}
      - CANTALOUPE_PROCESSOR_MANUALSELECTIONSTRATEGY_JPG=Java2dProcessor
      # Fallback, falls Cantaloupe ohne das nginx davor erreichbar ist: nie "public".
      # nginx setzt Cache-Control für /iiif/ ohnehin nach Sichtbarkeit (X-Media-Visibility).
      - CANTALOUPE_CACHE_CLIENT_PUBLIC=false
      - CANTALOUPE_CACHE_CLIENT_PRIVATE=true
      # Das Image setzt "debug": jede Anfrage und jeder Healthcheck schreibt
      # mehrere Zeilen. Zugriffe protokolliert nginx bereits.
      - CANTALOUPE_LOG_APPLICATION_LEVEL=${CANTALOUPE_LOG_LEVEL:-info}
      - CANTALOUPE_LOG_ACCESS_CONSOLEAPPENDER_ENABLED=false
    healthcheck:
      # Prüft nicht nur, dass der Server antwortet (immer 200), sondern auch,
      # dass der Cantaloupe-Prozess tatsächlich in seinen Cache schreiben
      # kann. Ohne diesen Check bleibt eine kaputte Cache-Ownership
      # unbemerkt: der Server antwortet weiter mit HTTP 200, liefert aber
      # jede Bildanfrage mit 0 Bytes aus.
      test: [ "CMD-SHELL", "curl -sf http://localhost:8182/iiif/3 && runuser -u cantaloupe -- sh -c 'd=$${CANTALOUPE_FILESYSTEMCACHE_PATHNAME:-/data/cache}; mkdir -p \"$$d\" && touch \"$$d/.healthcheck\" && rm -f \"$$d/.healthcheck\"'" ]
      interval: 10s
      timeout: 5s
      retries: 10

  oxigraph:
    image: oxigraph/oxigraph:latest
    profiles:
      - rdf
    restart: unless-stopped
    volumes:
      - oxigraph_data:/data
    # No healthcheck: the oxigraph image is distroless (no sh/curl/wget), and
    # `oxigraph query --location /data` (the only local CLI option) opens a
    # second RocksDB handle on the same store the running `serve` process
    # already holds, causing ~60s lock-contention stalls that blow any
    # reasonable timeout. The HTTP server itself responds fine; nothing in
    # this stack depends_on oxigraph's service_healthy.

  api:
    build:
      context: .
      dockerfile: ./docker/Dockerfile.backend
    environment:
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
      DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-5}
      DATABASE_MAX_OVERFLOW: ${DATABASE_MAX_OVERFLOW:-5}
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      ELASTICSEARCH_URL: ${ELASTICSEARCH_URL:-http://elasticsearch:9200}
      CANTALOUPE_URL: ${CANTALOUPE_URL:-http://cantaloupe:8182}
      CANTALOUPE_PUBLIC_URL: ${CANTALOUPE_PUBLIC_URL:-http://localhost}
      SECRET_KEY: ${SECRET_KEY}
      KATALON_SECRETS_KEY: ${KATALON_SECRETS_KEY}
      GEONAMES_USERNAME: ${GEONAMES_USERNAME:-demo}
      DEBUG: ${DEBUG:-false}
      MEDIA_ROOT: /var/lib/katalon/media
      KATALON_BASE_URL: ${KATALON_BASE_URL:-}
      DEFAULT_ADMIN_EMAIL: ${DEFAULT_ADMIN_EMAIL:-}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-}
      FIRST_RUN_CREDENTIALS_PATH: ${FIRST_RUN_CREDENTIALS_PATH:-/var/lib/katalon/first-run-credentials.txt}
      OAI_ADMIN_EMAIL: ${OAI_ADMIN_EMAIL:-}
      OAI_BASE_URL: ${OAI_BASE_URL:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost"]}
      CORS_ORIGIN_REGEX: ${CORS_ORIGIN_REGEX:-}
      MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-200}
      OXIGRAPH_ENABLED: ${OXIGRAPH_ENABLED:-false}
      OXIGRAPH_URL: ${OXIGRAPH_URL:-http://oxigraph:7878}
      SMTP_ENABLED: ${SMTP_ENABLED:-false}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      SMTP_SSL_TLS: ${SMTP_SSL_TLS:-false}
      SMTP_TIMEOUT_SECONDS: ${SMTP_TIMEOUT_SECONDS:-10}
      RATE_LIMIT_STORAGE_URI: ${RATE_LIMIT_STORAGE_URI:-redis://redis:6379/0}
    volumes:
      - ${MEDIA_ROOT:-/srv/katalon/media}:/var/lib/katalon/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      cantaloupe:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "curl -sf http://localhost:8000/health" ]
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    build:
      context: ./backend
      dockerfile: ../docker/Dockerfile.worker
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      ELASTICSEARCH_URL: ${ELASTICSEARCH_URL:-http://elasticsearch:9200}
      CANTALOUPE_URL: ${CANTALOUPE_URL:-http://cantaloupe:8182}
      CANTALOUPE_PUBLIC_URL: ${CANTALOUPE_PUBLIC_URL:-http://localhost}
      MEDIA_ROOT: /var/lib/katalon/media
      CELERY_CONCURRENCY: ${CELERY_CONCURRENCY:-}
      SECRET_KEY: ${SECRET_KEY}
      KATALON_SECRETS_KEY: ${KATALON_SECRETS_KEY}
      KATALON_BASE_URL: ${KATALON_BASE_URL:-}
      SMTP_ENABLED: ${SMTP_ENABLED:-false}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      SMTP_SSL_TLS: ${SMTP_SSL_TLS:-false}
      SMTP_TIMEOUT_SECONDS: ${SMTP_TIMEOUT_SECONDS:-10}
      OXIGRAPH_ENABLED: ${OXIGRAPH_ENABLED:-false}
      OXIGRAPH_URL: ${OXIGRAPH_URL:-http://oxigraph:7878}
    volumes:
      - ${MEDIA_ROOT:-/srv/katalon/media}:/var/lib/katalon/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      cantaloupe:
        condition: service_healthy

  beat:
    build:
      context: ./backend
      dockerfile: ../docker/Dockerfile.worker
    command: ["celery", "-A", "katalon.workers.celery_app", "beat", "--loglevel=info"]
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      ELASTICSEARCH_URL: ${ELASTICSEARCH_URL:-http://elasticsearch:9200}
      CANTALOUPE_URL: ${CANTALOUPE_URL:-http://cantaloupe:8182}
      CANTALOUPE_PUBLIC_URL: ${CANTALOUPE_PUBLIC_URL:-http://localhost}
      MEDIA_ROOT: /var/lib/katalon/media
      SECRET_KEY: ${SECRET_KEY}
      KATALON_SECRETS_KEY: ${KATALON_SECRETS_KEY}
      KATALON_BASE_URL: ${KATALON_BASE_URL:-}
      SMTP_ENABLED: ${SMTP_ENABLED:-false}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      SMTP_SSL_TLS: ${SMTP_SSL_TLS:-false}
      SMTP_TIMEOUT_SECONDS: ${SMTP_TIMEOUT_SECONDS:-10}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      cantaloupe:
        condition: service_healthy

  admin:
    build:
      context: .
      dockerfile: ./docker/Dockerfile.admin
    ports:
      - "3000:80"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O- http://127.0.0.1/index.html > /dev/null 2>&1 || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    depends_on:
      api:
        condition: service_healthy

  portal:
    build:
      context: .
      dockerfile: ./docker/Dockerfile.portal
    ports:
      - "3001:80"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O- http://127.0.0.1/index.html > /dev/null 2>&1 || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    depends_on:
      api:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/certs:/etc/nginx/certs:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      api:
        condition: service_healthy
      admin:
        condition: service_healthy
      portal:
        condition: service_healthy

  backup:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_HOST: db
      POSTGRES_USER: ${POSTGRES_USER:-katalon}
      POSTGRES_DB: ${POSTGRES_DB:-katalon}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_ENABLED: ${BACKUP_ENABLED:-true}
      BACKUP_AT: ${BACKUP_AT:-}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
    entrypoint: ["/bin/sh", "/backup.sh"]
    volumes:
      - ./docker/backup.sh:/backup.sh:ro
      - ${MEDIA_ROOT:-/srv/katalon/media}:/media:ro
      - ${BACKUP_ROOT:-/srv/katalon/backups}:/backups
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
  es_data:
  cantaloupe_cache:
  oxigraph_data:
