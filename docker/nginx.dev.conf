resolver 127.0.0.11 valid=10s ipv6=off;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# LOD content negotiation: the JSON-LD @id of every public record is its
# plain frontend URL (see record_uri_path() in jsonld_format.py). A crawler
# dereferencing that URI with an RDF Accept header gets the machine-readable
# representation from the API instead of the portal SPA's HTML shell.
map $http_accept $rdf_negotiated {
    default 0;
    "~*application/ld\+json" 1;
    "~*text/turtle" 1;
}

# Link-preview, search and AI crawlers do not run the SPA's JavaScript. They get
# the record's meta tags rendered by the API (services/seo_service.py) instead
# of the empty HTML shell. Extend the list as new bots matter.
map $http_user_agent $seo_bot {
    default 0;
    "~*(facebookexternalhit|facebot|twitterbot|linkedinbot|slackbot|whatsapp|telegrambot|discordbot|mastodon|bluesky|skypeuripreview|pinterestbot|googlebot|bingbot|duckduckbot|yandexbot|applebot|gptbot|chatgpt-user|oai-searchbot|claudebot|claude-user|perplexitybot|ccbot)" 1;
}

# Cache-Control for /iiif/ from the media's visibility (set by /v1/media/_authorize via
# auth_request_set): shared caches (CDN, proxies) may keep only what anonymous
# visitors may see; derivatives of internal media stay in the requesting browser.
map $media_visibility $iiif_cache_control {
    public  "public, max-age=2592000";
    default "private, max-age=86400";
}

server {
    listen 80;
    listen 443 ssl;
    ssl_certificate /etc/nginx/certs/localhost.crt;
    ssl_certificate_key /etc/nginx/certs/localhost.key;
    server_tokens off;
    client_max_body_size 500m;

    # Dev CSP allows ws: / wss: and unsafe-eval for Vite HMR and sourcemaps
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob: https:; media-src 'self' blob: https:; connect-src 'self' https: ws: wss:; frame-src 'self' https://www.openstreetmap.org; worker-src 'self' blob:" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;

    location /api/ {
        set $upstream_api api:8000;
        proxy_pass http://$upstream_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /v1/ {
        set $upstream_api api:8000;
        proxy_pass http://$upstream_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /portal/v1/ {
        set $upstream_api api:8000;
        proxy_pass http://$upstream_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Same UUID-keyed paths as /portal/v1/{type}s/{id}; content-negotiated
    # so the canonical record URI (see map above) stays dereferenceable.
    location ~ "^/(objects|entities|places|occurrences|collections)/([0-9a-fA-F-]{36})/?$" {
        set $upstream_api api:8000;
        set $upstream_portal portal:5174;
        add_header Vary "Accept, User-Agent" always;
        # An add_header here drops the server-level ones: repeat them.
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob: https:; media-src 'self' blob: https:; connect-src 'self' https: ws: wss:; frame-src 'self' https://www.openstreetmap.org; worker-src 'self' blob:" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
        if ($rdf_negotiated = 1) {
            rewrite ^/(objects|entities|places|occurrences|collections)/(.*)$ /portal/v1/$1/$2 break;
            proxy_pass http://$upstream_api;
        }
        if ($seo_bot = 1) {
            rewrite ^/(objects|entities|places|occurrences|collections)/(.*)$ /portal/v1/seo/$1/$2 break;
            proxy_pass http://$upstream_api;
        }
        proxy_pass http://$upstream_portal;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        set $upstream_api api:8000;
        proxy_pass http://$upstream_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /oai {
        set $upstream_api api:8000;
        proxy_pass http://$upstream_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /sparql {
        set $upstream_api api:8000;
        proxy_pass http://$upstream_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location = /sitemap.xml {
        set $upstream_api api:8000;
        proxy_pass http://$upstream_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /robots.txt {
        set $upstream_api api:8000;
        proxy_pass http://$upstream_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /llms.txt {
        set $upstream_api api:8000;
        proxy_pass http://$upstream_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /ark:/ {
        set $upstream_api api:8000;
        proxy_pass http://$upstream_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /iiif/ {
        auth_request /internal/media-authorize;
        auth_request_set $media_visibility $upstream_http_x_media_visibility;
        set $upstream_cantaloupe cantaloupe:8182;
        proxy_pass http://$upstream_cantaloupe;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 300s;
        proxy_buffering off;
        # Cantaloupe marks every derivative public; decide by visibility instead.
        proxy_hide_header Cache-Control;
        add_header Cache-Control $iiif_cache_control;
        # An add_header here drops the server-level ones: repeat them.
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob: https:; media-src 'self' blob: https:; connect-src 'self' https: ws: wss:; frame-src 'self' https://www.openstreetmap.org; worker-src 'self' blob:" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
    }

    # Cantaloupe has no auth of its own; gate every /iiif/ request against
    # MediaFile.is_public + object visibility via the backend before proxying.
    location = /internal/media-authorize {
        internal;
        set $upstream_api api:8000;
        proxy_pass http://$upstream_api/v1/media/_authorize;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header Authorization $http_authorization;
    }

    location = /admin {
        return 308 /admin/;
    }

    location /admin/ {
        set $upstream_admin admin:5173;
        proxy_pass http://$upstream_admin;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        set $upstream_portal portal:5174;
        proxy_pass http://$upstream_portal;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
