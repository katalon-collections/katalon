# nginx Produktionskonfiguration – TLS-Terminierung + Reverse Proxy
# Passe server_name und Zertifikatspfade an deine Domain an.

upstream api    { server api:8000; }
upstream admin  { server admin:80; }
upstream portal { server portal:80; }

# HTTP → HTTPS-Redirect
server {
    listen 80;
    server_name example.org admin.example.org;
    return 301 https://$host$request_uri;
}

# Public-Portal (https://example.org)
server {
    listen 443 ssl;
    server_name example.org;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    client_max_body_size 250m;

    # API (proxied auf /v1/)
    location /v1/ {
        proxy_pass http://api/v1/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # API-Docs
    location /api/ {
        proxy_pass http://api/api/;
        proxy_set_header Host $host;
    }

    # OAI-PMH direkt erreichbar
    location = /oai {
        proxy_pass http://api/v1/oai;
        proxy_set_header Host $host;
    }

    # Portal SPA
    location / {
        proxy_pass http://portal/;
        proxy_set_header Host $host;
    }
}

# Admin-UI (https://admin.example.org)
server {
    listen 443 ssl;
    server_name admin.example.org;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    client_max_body_size 250m;

    location /v1/ {
        proxy_pass http://api/v1/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass http://admin/;
        proxy_set_header Host $host;
    }
}
