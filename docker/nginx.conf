resolver 127.0.0.11 valid=10s ipv6=off;

# Vorfilter gegen Crawler-Last: hält Bot-Traffic von den API-Workern und
# DB-Verbindungen fern, bevor Python ihn sieht. Das anwendungsseitige
# Rate-Limiting (slowapi, RATE_LIMIT_*) bleibt als zweite, feinere Stufe
# bestehen. Schlüssel ist $binary_remote_addr, also der direkte Peer — steht
# ein weiterer Proxy davor, greift die Drosselung auf dessen IP.
limit_req_zone $binary_remote_addr zone=portal_read:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=portal_heavy:10m rate=2r/s;
limit_req_status 429;

server {
    listen 80;
    listen 443 ssl;
    ssl_certificate /etc/nginx/certs/localhost.crt;
    ssl_certificate_key /etc/nginx/certs/localhost.key;
    client_max_body_size 500m;

    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob: https:; media-src 'self' blob: https:; connect-src 'self' https:; frame-src 'self' https://www.openstreetmap.org; worker-src 'self' blob:" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;

    location /api/ {
        set $upstream_api api:8000;
        proxy_pass http://$upstream_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /v1/ {
        set $upstream_api api:8000;
        proxy_pass http://$upstream_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /portal/v1/ {
        set $upstream_api api:8000;
        limit_req zone=portal_read burst=20 nodelay;
        proxy_pass http://$upstream_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        set $upstream_api api:8000;
        proxy_pass http://$upstream_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /oai {
        set $upstream_api api:8000;
        limit_req zone=portal_heavy burst=5 nodelay;
        proxy_pass http://$upstream_api;
        proxy_set_header Host $host;
    }

    location /sparql {
        set $upstream_api api:8000;
        limit_req zone=portal_heavy burst=5 nodelay;
        proxy_pass http://$upstream_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location = /robots.txt {
        set $upstream_api api:8000;
        proxy_pass http://$upstream_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /llms.txt {
        set $upstream_api api:8000;
        proxy_pass http://$upstream_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /ark:/ {
        set $upstream_api api:8000;
        proxy_pass http://$upstream_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /iiif/ {
        auth_request /internal/media-authorize;
        set $upstream_cantaloupe cantaloupe:8182;
        proxy_pass http://$upstream_cantaloupe;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }

    # Cantaloupe has no auth of its own; gate every /iiif/ request against
    # MediaFile.is_public + object visibility via the backend before proxying.
    location = /internal/media-authorize {
        internal;
        set $upstream_api api:8000;
        proxy_pass http://$upstream_api/v1/media/_authorize;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header Authorization $http_authorization;
    }

    location /admin/ {
        set $upstream_admin admin;
        rewrite ^/admin/(.*)$ /$1 break;
        proxy_pass http://$upstream_admin;
        proxy_set_header Host $host;
    }

    location / {
        set $upstream_portal portal;
        proxy_pass http://$upstream_portal;
        proxy_set_header Host $host;
    }
}
