upstream api { server api:8000; }
upstream admin { server admin:80; }
upstream portal { server portal:80; }
upstream cantaloupe { server cantaloupe:8182; }

server {
    listen 80;

    location /api/ {
        proxy_pass http://api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /v1/ {
        proxy_pass http://api/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Expose Cantaloupe IIIF Image API so browsers can load tiles and info.json
    location /iiif/ {
        proxy_pass http://cantaloupe/iiif/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Allow large image responses
        proxy_read_timeout 300s;
        proxy_buffering off;
    }

    location /admin/ {
        proxy_pass http://admin/;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://portal/;
        proxy_set_header Host $host;
    }
}
