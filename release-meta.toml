# Manuell gepflegte Release-Metadaten für katalon-cli (Issue #286).
# Nur ändern wenn sich das jeweilige Ding tatsächlich ändert:
#
# compose_revision            – hochzählen, wenn sich Service-Topologie/Ports/Volumes
#                                in der katalon-cli compose.yaml.j2-Struktur ändern
#                                (neuer Service, andere Ports, anderes Volume-Layout).
# minimum_installer_version   – hochzählen, wenn dieses Release ein Feature der
#                                katalon-cli voraussetzt, das ältere CLI-Versionen
#                                nicht haben (z.B. neues Compose-Template-Feld).
# requires                    – Fremdservice-Versionsanforderungen, ändert sich selten.
#
# env_vars                    – Neu hinzugekommene Umgebungsvariablen für dieses Release.
#                               Werden von katalon-cli beim Update ausgewertet und ggf.
#                               im .env ergänzt / abgefragt.
#                               Objektstruktur:
#                                 key: str (Pflicht, z.B. "OIDC_CLIENT_ID")
#                                 description: str (Kurze Erklärung für Admins)
#                                 required: bool (default false, bricht Start ab wenn fehlt)
#                                 secret: bool (default false, kann zufällig generiert werden)
#                                 default: str | null (optionaler Standardwert)
#                               Kann top-level definiert werden ([[env_vars]]) oder
#                               versionsspezifisch ([[releases."1.31.0".env_vars]]).
#
# deprecated_env_vars         – Veraltete / nicht mehr unterstützte Umgebungsvariablen.
#                               Objektstruktur:
#                                 key: str (Pflicht, z.B. "OLD_VAR")
#                                 note: str (optional, Erklärung / Nachfolger)
#                               Kann top-level definiert werden ([[deprecated_env_vars]])
#                               oder versionsspezifisch ([[releases."1.31.0".deprecated_env_vars]]).

compose_revision = 3
minimum_installer_version = "0.3.0"

[requires]
postgres = ">=16"
elasticsearch = ">=8.15,<9"

[[releases."1.40.3".deprecated_env_vars]]
key = "DEFAULT_ADMIN_PASSWORD"
note = "Umbenannt in INITIAL_ADMIN_PASSWORD (optional). Die Zeile kann aus der .env entfernt werden."

# Revision 3: Cantaloupe-Derivat-Cache auf Platte (cantaloupe-cache-init, ./cantaloupe-cache)
# statt tmpfs; braucht das Compose-Template ab katalon-cli 0.3.0.

# 1.45.0: optionale Stellschrauben für Prozesse (Image-Defaults greifen ohne Eintrag).
[[releases."1.45.0".env_vars]]
key = "WEB_CONCURRENCY"
description = "Anzahl API-Prozesse (Default 2; kleine Server 1, mehr CPU/RAM z. B. 4)"

[[releases."1.45.0".env_vars]]
key = "DATABASE_POOL_SIZE"
description = "DB-Verbindungen pro API-Prozess (Default 5); Summe aller Prozesse unter max_connections halten"

[[releases."1.45.0".env_vars]]
key = "DATABASE_MAX_OVERFLOW"
description = "Zusätzliche DB-Verbindungen pro API-Prozess bei Lastspitzen (Default 5)"

[[releases."1.45.0".env_vars]]
key = "CELERY_CONCURRENCY"
description = "Threads des Celery-Workers (leer = Anzahl CPU-Kerne); kleiner wählen, damit das Portal beim Reindex flüssig bleibt"
