# Cantaloupe-Konfiguration für IIIF-Support
# Diese Datei überschreibt die Standard-Cantaloupe-Konfiguration
services:
  cantaloupe:
    environment:
      - CANTALOUPE_SOURCE_STATIC=FilesystemSource
      - CANTALOUPE_FILESYSTEMSOURCE_LOOKUP_STRATEGY=BasicLookupStrategy
      - CANTALOUPE_FILESYSTEMSOURCE_BASICLOOKUPSTRATEGY_PATH_PREFIX=/var/lib/cantaloupe/images/
      - CANTALOUPE_BASE_URI=http://localhost
  api:
    environment:
      - CANTALOUPE_URL=http://cantaloupe:8182
      - CANTALOUPE_PUBLIC_URL=http://localhost
  worker:
    environment:
      - CANTALOUPE_URL=http://cantaloupe:8182
      - CANTALOUPE_PUBLIC_URL=http://localhost
