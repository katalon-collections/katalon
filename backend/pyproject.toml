[project]
name = "katalon"
version = "1.23.0"
description = "Katalon – Metadata Management System for GLAM collections"
license = "AGPL-3.0-or-later"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "alembic>=1.13.1",
    "pydantic[email]>=2.7.0",
    "pydantic-settings>=2.2.1",
    "celery[redis]>=5.4.0",
    "click-didyoumean==0.3.1",
    "redis>=5.0.4",
    "elasticsearch[async]>=8.13.0,<9.0.0",
    "python-jose[cryptography]>=3.3.0",
    "cryptography>=43.0.0",
    "bcrypt>=4.0",
    "python-multipart>=0.0.9",
    "aiofiles>=23.2.1",
    "httpx>=0.27.0",
    "geoalchemy2>=0.15.1",
    "shapely>=2.0.4",
    "pillow>=10.3.0",
    "pyvips>=2.2.3",
    "openpyxl>=3.1.0",
    "slowapi>=0.1.9",
    "pyyaml>=6.0",
    "jinja2>=3.1.6",
    "lxml>=6.1.1",
    "rapidfuzz>=3.9.0",
    "rdflib>=7.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.6",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.4.4",
    "mypy>=1.10.0",
    "testcontainers[postgres]>=4.4.0",
    "locust>=2.29.0",
    "pytest-archon>=0.0.7",
]

[project.scripts]
katalon-reset-admin = "katalon.management.reset_admin:main"
katalon-manage = "katalon.management.runner:launcher"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/katalon"]

[tool.ruff]
src = ["src"]
line-length = 100
target-version = "py312"
[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "UP",
    "B",       # flake8-bugbear
    "C4",      # flake8-comprehensions
    "SIM",     # flake8-simplify
    "ASYNC",   # flake8-async
    "RUF",     # ruff-specific
    "T20",     # flake8-print
    "S",       # flake8-bandit
]
ignore = [
    "E501",      # line length
    "B008",      # function call in argument defaults (FastAPI Depends/require_role)
    "B904",      # raise ... from err
    "B007",      # loop control variable not used
    "B009",      # getattr with constant attribute
    "C401",      # unnecessary generator (rewrite as set comprehension)
    "C416",      # unnecessary set comprehension
    "SIM102",    # nested if statements
    "SIM105",    # try-except-pass instead of contextlib.suppress
    "SIM108",    # use ternary operator
    "SIM118",    # key in dict.keys()
    "RUF001",    # ambiguous unicode characters in string
    "RUF002",    # ambiguous unicode characters in docstring
    "RUF003",    # ambiguous unicode characters in comment
    "RUF012",    # mutable class attributes (Pydantic / SQLAlchemy models)
    "RUF022",    # unsorted __all__
    "RUF059",    # unpacked variable never used
    "RUF100",    # unused noqa directive
    "ASYNC240",  # blocking pathlib methods in async functions
    "S101",      # assert statements
    "S105",      # hardcoded password false positives (token_type, etc.)
    "S110",      # try-except-pass without logging
    "S311",      # pseudo-random generator
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "SIM", "RUF"]
"scripts/**" = ["T201", "S", "B007"]
"src/katalon/management/**" = ["T201", "ASYNC250", "RUF059"]
"migrations/**" = ["S608", "RUF100"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[dependency-groups]
dev = [
    "celery-types>=0.26.0",
    "pytest-archon>=0.0.7",
    "types-aiofiles>=25.1.0.20260518",
    "types-pyyaml>=6.0.12.20260815",
]
