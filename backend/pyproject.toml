[project]
name = "katalon"
version = "1.3.3"
description = "Katalon – Metadata Management System for GLAM collections"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "alembic>=1.13.1",
    "pydantic[email]>=2.7.0",
    "pydantic-settings>=2.2.1",
    "celery[redis]>=5.4.0",
    "click-didyoumean==0.3.1",
    "redis>=5.0.4",
    "elasticsearch[async]>=8.13.0,<9.0.0",
    "python-jose[cryptography]>=3.3.0",
    "cryptography>=43.0.0",
    "bcrypt>=4.0",
    "python-multipart>=0.0.9",
    "aiofiles>=23.2.1",
    "httpx>=0.27.0",
    "geoalchemy2>=0.15.1",
    "shapely>=2.0.4",
    "pillow>=10.3.0",
    "openpyxl>=3.1.0",
    "slowapi>=0.1.9",
    "pyyaml>=6.0",
    "jinja2>=3.1.6",
    "lxml>=6.1.1",
    "rapidfuzz>=3.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.6",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.4.4",
    "mypy>=1.10.0",
    "testcontainers[postgres]>=4.4.0",
    "locust>=2.29.0",
]

[project.scripts]
katalon-reset-admin = "katalon.management.reset_admin:main"
katalon-manage = "katalon.management.runner:launcher"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/katalon"]

[tool.ruff]
src = ["src"]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[dependency-groups]
dev = [
    "celery-types>=0.26.0",
    "types-aiofiles>=25.1.0.20260518",
    "types-pyyaml>=6.0.12.20260815",
]
