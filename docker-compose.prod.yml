# docker-compose.prod.yml – Produktions-Override
#
# Verwendung:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Voraussetzungen:
#   - .env-Datei vorhanden (aus .env.example)
#   - TLS-Zertifikate unter ./docker/certs/ (fullchain.pem, privkey.pem)
#   - docker/nginx.prod.conf vorhanden (mit TLS-Konfiguration)

services:
  db:
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    deploy:
      resources:
        limits:
          memory: 512m

  redis:
    restart: always
    command: redis-server --save 60 1 --loglevel warning
    deploy:
      resources:
        limits:
          memory: 128m

  elasticsearch:
    restart: always
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
    deploy:
      resources:
        limits:
          memory: 2g

  cantaloupe:
    restart: always
    deploy:
      resources:
        limits:
          memory: 512m

  api:
    restart: always
    # Keine direkt exponierten Ports in Produktion — nur nginx spricht mit api
    ports: !reset []
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      ELASTICSEARCH_URL: ${ELASTICSEARCH_URL}
      CANTALOUPE_URL: ${CANTALOUPE_URL}
      CANTALOUPE_PUBLIC_URL: ${CANTALOUPE_PUBLIC_URL}
      SECRET_KEY: ${SECRET_KEY}
      MEDIA_ROOT: /var/lib/katalon/media
      MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-200}
      DEFAULT_ADMIN_EMAIL: ${DEFAULT_ADMIN_EMAIL}
      DEFAULT_ADMIN_PASSWORD: ${DEFAULT_ADMIN_PASSWORD}
      KATALON_BASE_URL: ${KATALON_BASE_URL}
      FIRST_RUN_CREDENTIALS_PATH: ${FIRST_RUN_CREDENTIALS_PATH:-/var/lib/katalon/first-run-credentials.txt}
      OAI_ADMIN_EMAIL: ${OAI_ADMIN_EMAIL}
      CORS_ORIGINS: ${CORS_ORIGINS}
      DEBUG: "false"
    deploy:
      resources:
        limits:
          memory: 512m

  worker:
    restart: always
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      CANTALOUPE_URL: ${CANTALOUPE_URL}
      CANTALOUPE_PUBLIC_URL: ${CANTALOUPE_PUBLIC_URL}
      MEDIA_ROOT: /var/lib/katalon/media
    deploy:
      resources:
        limits:
          memory: 512m

  admin:
    restart: always
    ports: !reset []
    build:
      args:
        VITE_API_URL: ${ADMIN_VITE_API_URL:-}
        VITE_PORTAL_URL: ${PORTAL_URL:-}
        VITE_ADMIN_FEEDBACK_ENABLED: ${VITE_ADMIN_FEEDBACK_ENABLED:-}

  portal:
    restart: always
    ports: !reset []
    build:
      args:
        VITE_API_URL: ${PORTAL_VITE_API_URL:-}
        VITE_PORTAL_FEEDBACK_ENABLED: ${VITE_PORTAL_FEEDBACK_ENABLED:-}

  nginx:
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/certs:/etc/nginx/certs:ro
    deploy:
      resources:
        limits:
          memory: 64m
