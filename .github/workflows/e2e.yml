name: Playwright E2E

# on:
#   push:
#     branches:
#       - main
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: katalon
          POSTGRES_PASSWORD: katalon
          POSTGRES_DB: katalon
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U katalon -d katalon"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install -e .[dev]

      - name: Install admin frontend dependencies
        working-directory: frontend/admin
        run: npm ci

      - name: Install E2E dependencies
        working-directory: e2e
        run: npm ci

      - name: Install Playwright browser
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        working-directory: e2e
        env:
          DATABASE_URL: postgresql+asyncpg://katalon:katalon@127.0.0.1:5432/katalon
          REDIS_URL: redis://127.0.0.1:6379/0
          MEDIA_ROOT: /tmp/katalon-media
        run: npm run test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7
