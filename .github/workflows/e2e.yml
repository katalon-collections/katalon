name: Playwright E2E

# on:
#   push:
#     branches:
#       - main
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: katalon
          POSTGRES_PASSWORD: katalon
          POSTGRES_DB: katalon
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U katalon -d katalon"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      cantaloupe:
        image: islandora/cantaloupe:main
        env:
          CANTALOUPE_SOURCE_STATIC: FilesystemSource
          CANTALOUPE_FILESYSTEMSOURCE_LOOKUP_STRATEGY: BasicLookupStrategy
          CANTALOUPE_FILESYSTEMSOURCE_BASICLOOKUPSTRATEGY_PATH_PREFIX: /var/lib/cantaloupe/images/
          CANTALOUPE_BASE_URI: http://localhost
        ports:
          - 8182:8182
        volumes:
          - /tmp/katalon-media:/var/lib/cantaloupe/images
        options: >-
          --health-cmd "curl -sf http://localhost:8182/iiif/3"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'

      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install -e .[dev]

      - name: Install admin frontend dependencies
        working-directory: frontend/admin
        run: npm ci

      - name: Install E2E dependencies
        working-directory: e2e
        run: npm ci

      - name: Install Playwright browser
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        working-directory: e2e
        env:
          DATABASE_URL: postgresql+asyncpg://katalon:katalon@127.0.0.1:5432/katalon
          REDIS_URL: redis://127.0.0.1:6379/0
          CANTALOUPE_URL: http://127.0.0.1:8182
          MEDIA_ROOT: /tmp/katalon-media
          KATALON_SECRETS_KEY: test-katalon-secrets-key-32-chars
        run: npm run test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7
