name: Public container images

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  validate:
    if: ${{ github.repository == 'katalon-collections/katalon' }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          version=${TAG#v}
          grep -q "^version = \"${version}\"$" backend/pyproject.toml
          grep -q "\"version\": \"${version}\"" frontend/admin/package.json
          grep -q "\"version\": \"${version}\"" frontend/portal/package.json
          echo "value=$version" >> "$GITHUB_OUTPUT"

  build:
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: api
            context: .
            dockerfile: ./docker/Dockerfile.backend
          - name: worker
            context: ./backend
            dockerfile: ./docker/Dockerfile.worker
          - name: admin
            context: .
            dockerfile: ./docker/Dockerfile.admin
          - name: portal
            context: .
            dockerfile: ./docker/Dockerfile.portal
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build image (local, unpushed)
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: false
          load: true
          tags: local/katalon-${{ matrix.name }}:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Scan image for critical/high CVEs
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: local/katalon-${{ matrix.name }}:scan
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true
      - name: Push scanned image
        run: |
          docker tag local/katalon-${{ matrix.name }}:scan \
            ghcr.io/katalon-collections/katalon-${{ matrix.name }}:${{ needs.validate.outputs.version }}
          docker push ghcr.io/katalon-collections/katalon-${{ matrix.name }}:${{ needs.validate.outputs.version }}

  release:
    needs: [validate, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Generate release metadata
        run: python3 scripts/gen_release_metadata.py --tag "${GITHUB_REF_NAME}"
      - name: Create GitHub release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ github.ref_name }}
          files: katalon-release.json
