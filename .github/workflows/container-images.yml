name: Public container images

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  validate:
    if: ${{ github.repository == 'katalon-collections/katalon' }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          version=${TAG#v}
          grep -q "^version = \"${version}\"$" backend/pyproject.toml
          grep -q "\"version\": \"${version}\"" frontend/admin/package.json
          grep -q "\"version\": \"${version}\"" frontend/portal/package.json
          echo "value=$version" >> "$GITHUB_OUTPUT"

  build:
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: api
            context: .
            dockerfile: ./docker/Dockerfile.backend
          - name: worker
            context: ./backend
            dockerfile: ../docker/Dockerfile.worker
          - name: admin
            context: .
            dockerfile: ./docker/Dockerfile.admin
          - name: portal
            context: .
            dockerfile: ./docker/Dockerfile.portal
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ghcr.io/katalon-collections/katalon-${{ matrix.name }}:${{ needs.validate.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    needs: [validate, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Generate release metadata
        run: python3 scripts/gen_release_metadata.py --tag "${GITHUB_REF_NAME}"
      - name: Create GitHub release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ github.ref_name }}
          files: katalon-release.json
